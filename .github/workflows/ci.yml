name: CI - Test and Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check out badAuthenticator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: tantosec/badAuthenticator
          ref: 331746951a9efb6c81860fbd9d0172b7ef1e9e04
          path: .test-deps/badAuthenticator
          persist-credentials: false

      - name: Build test authenticator
        run: docker build -t webauthn-interceptor-badauthenticator .test-deps/badAuthenticator

      - name: Install headless Chrome
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and test
        run: pnpm test
