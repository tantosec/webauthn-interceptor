<!doctype html>
<html lang="en-AU">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="interceptor-modal.css" />
    </head>
    <body class="text-sm font-sans bg-white p-4 flex flex-col h-screen">
        <div class="header-section flex-shrink-0">
            <h2 class="text-lg font-semibold text-black">Select a credential</h2>
            <p class="text-black text-xs mt-1 mb-2">
                Choose a credential from badAuthenticator for this website.
            </p>
        </div>

        <div
            id="credentialList"
            class="my-4 space-y-2 flex-grow overflow-y-auto"
            role="listbox"
            aria-label="Available credentials"
        >
            <p id="loadingMessage" class="text-center text-gray-500" role="status" aria-live="polite">
                Loading credentials...
            </p>
        </div>
        <div class="actions-section flex justify-end gap-3 mt-auto flex-shrink-0">
            <button
                id="selectButton"
                class="px-3 py-1.5 text-sm bg-red-600 hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium rounded shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
                disabled
            >
                Select
            </button>
            <button
                id="cancelButton"
                class="px-3 py-1.5 text-sm bg-white hover:bg-gray-100 disabled:opacity-50 disabled:cursor-not-allowed text-black font-medium border border-black rounded shadow-sm"
            >
                Cancel
            </button>
        </div>

        <script src="credential-selector.js"></script>
    </body>
</html>
